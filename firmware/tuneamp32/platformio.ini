; =====================================================================
; TuneAmp32: amplificador Bluetooth que se afina a tus altavoces
;
; ESP32 clásico (DevKit de 30 pines, ESP32-WROOM-32) + DAC PCM5102A
; (placa GY-PCM5102) + amplificador TPA3116D2.
;
; Compilar y grabar (desde esta carpeta):
;   pio run -t upload
;   pio device monitor
; =====================================================================

[env:esp32dev]
platform = espressif32@6.12.0     ; núcleo Arduino-ESP32 2.0.17
board = esp32dev
framework = arduino
; Bluetooth + WiFi ocupan mucho: partición grande para la aplicación
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.3.0
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12
